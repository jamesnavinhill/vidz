[package]
name = "vidz"
version = "0.1.0"
description = "Local video viewer for 10k+ clips"
authors = ["you"]
edition = "2021"

[profile.dev]
opt-level = 1

[lib]
name = "vidz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "7"
tokio = { version = "1", features = ["full"] }
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
parking_lot = "0.12"
thiserror = "2"
directories = "5"

